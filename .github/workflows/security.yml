name: Security checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Commit to scan (defaults to the triggering commit)
        required: false
        type: string
      use_docs_runner:
        description: Run documentation deployment checks on the self-hosted Linux X64 runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.10"
  SEMGREP_VERSION: "1.187.0"

jobs:
  secrets:
    name: Gitleaks secret scan
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Scan checked-out source for secrets
        env:
          GITLEAKS_VERSION: v8.30.1
        run: go run "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION" dir --redact --no-banner .

  python:
    name: Python and Django security
    needs: secrets
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep on Python and Django templates
        run: |
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep --test --metrics=off .github/semgrep
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep scan --strict --error --metrics=off --no-rewrite-rule-ids \
            --config p/python --config p/django --config .github/semgrep/django-csrf.yml \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token django_gc

      - name: Audit locked Python dependencies for supported runtimes
        run: |
          for python_version in 3.12 3.13 3.14 3.15; do
            uv audit --locked --python-version "$python_version"
          done

  javascript:
    name: JavaScript and TypeScript security
    needs: python
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep on documentation JavaScript and TypeScript
        run: |
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep scan --strict --error --metrics=off \
            --config p/javascript --config p/typescript docs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/package.json
          package-manager-cache: false

      - name: Audit locked npm dependencies
        working-directory: docs
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm audit --package-lock-only --audit-level=low

  workflows:
    name: GitHub Actions security
    needs: javascript
    runs-on: >-
      ${{ fromJSON(inputs.use_docs_runner && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep on GitHub Actions
        run: |
          uv tool run --python 3.13 --from "semgrep==$SEMGREP_VERSION" semgrep scan --strict --error --metrics=off \
            --config p/github-actions .github/workflows

      - name: Check workflow and deployment script syntax
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          for script in .github/docs/*.sh .github/scripts/compile-translations.sh; do
            bash -n "$script"
          done
          shellcheck .github/docs/*.sh .github/scripts/compile-translations.sh
          bash .github/docs/test-deploy.sh
