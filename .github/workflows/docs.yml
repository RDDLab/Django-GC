name: Documentation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit from main to deploy (defaults to the selected main revision)
        type: string
        required: false

permissions:
  contents: read

jobs:
  revision:
    name: Verify source belongs to main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve documentation revision
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
            echo "::error::The documentation revision must be a commit in main."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  security:
    name: Scan deployment revision
    needs: revision
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ needs.revision.outputs.source_sha }}

  checks:
    name: Verify successful tests for deployment revision
    needs: [revision, security]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/tested-revision.yml
    with:
      source_sha: ${{ needs.revision.outputs.source_sha }}

  prepare:
    name: Prepare documentation server
    needs: checks
    uses: ./.github/workflows/prepare-docs.yml

  deploy:
    name: Deploy documentation over SSH
    needs: [revision, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: docs-production
      url: https://django-gc.rdd-lab.com/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Send documentation source and deploy
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.revision.outputs.source_sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          DOCS_PORT: ${{ vars.DOCS_PORT }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Full source and workflow commit SHAs are required."
            exit 1
          fi
          if [[ ! "$DOCS_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( DOCS_PORT > 65535 )); then
            echo "::error::Set DOCS_PORT to a free host port from 1 to 65535."
            exit 1
          fi

          source_paths=(docs)
          if git cat-file -e "$SOURCE_SHA:.github/docs/Dockerfile" 2>/dev/null; then
            source_paths+=(.github/docs)
          fi

          git archive "$SOURCE_SHA" "${source_paths[@]}" |
            bash .github/docs/ssh.sh \
              "bash \"\$HOME/.local/share/django-gc-docs/$GITHUB_SHA/deploy-docs.sh\" $SOURCE_SHA $DOCS_PORT"
