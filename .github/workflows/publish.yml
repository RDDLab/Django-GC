name: Upload Django-GC Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Scan package revision
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ github.sha }}

  checks:
    name: Verify package revision
    needs: security
    uses: ./.github/workflows/testing.yml
    with:
      source_sha: ${{ github.sha }}

  release-build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release revision from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The package revision must be a commit in main."
            exit 1
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Compile translations and build distributions
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
          bash .github/scripts/compile-translations.sh
          uv build --python 3.12

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    timeout-minutes: 10
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/django-gc

    steps:
      - name: Download distributions from artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  dispatch-docs:
    name: Trigger documentation deployment on main
    needs: pypi-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch documentation workflow for the published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f "source_sha=$GITHUB_SHA"
