name: Prepare documentation server

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Install documentation deployment files as the SSH user
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: docs-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare server files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full workflow commit SHA is required."
            exit 1
          fi

          remote_command=$(cat <<'SH'
          set -eu
          upload_dir=$(mktemp -d)
          trap 'rm -rf -- "$upload_dir"' EXIT
          tar -xf - -C "$upload_dir" -- prepare-server.sh deploy-docs.sh compose.yml
          bash "$upload_dir/prepare-server.sh" "$DOCS_WORKFLOW_SHA"
          SH
          )
          tar -C .github/docs -cf - prepare-server.sh deploy-docs.sh compose.yml |
            bash .github/docs/ssh.sh "export DOCS_WORKFLOW_SHA=$GITHUB_SHA; $remote_command"
